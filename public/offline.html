<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090b0e">
    <title>Нет подключения — BOOKLY</title>
    <style>
      :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090b0e;color:#f4f5f2}
      *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0,#242a2d 0,#14181b 38%,#090b0e 78%)}
      main{width:min(100%,380px);padding:32px 26px;text-align:center;border:1px solid #ffffff20;border-radius:24px;background:linear-gradient(145deg,#ffffff12,#ffffff04),#111516aa;box-shadow:inset 0 1px #ffffff20,0 24px 70px #0008;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
      img{width:68px;height:68px;margin-bottom:12px}p{margin:0;color:#a4aaa8;font-size:14px;line-height:1.65}h1{margin:8px 0 12px;font-size:25px;font-weight:550;letter-spacing:-.04em}button{min-height:46px;margin-top:24px;padding:0 18px;border:1px solid #ffffff42;border-radius:14px;background:linear-gradient(150deg,#ffffff2b,#ffffff0a),#ffffff08;color:#f6f6f0;font:inherit;box-shadow:inset 0 1px #ffffff55,0 8px 22px #0005}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/bookly-192.png" alt="">
      <div>BOOKLY</div>
      <h1>Нет подключения</h1>
      <p>Чтобы продолжить, подключитесь к интернету и попробуйте ещё раз. Актуальные записи появятся после загрузки BOOKLY.</p>
      <button type="button" onclick="location.reload()">Попробовать снова</button>
    </main>
  </body>
</html>
